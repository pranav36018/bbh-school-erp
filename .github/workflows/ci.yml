name: CI/CD Pipeline - India Unified School ERP

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-build:
    name: Test & Build Production Bundle
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: school_erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Database Push (Migrations)
        run: npx prisma db push
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/school_erp_test?schema=public

      - name: Run Automated Test Suite
        run: npm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/school_erp_test?schema=public
          JWT_SECRET: test-jwt-secret-key-32chars-minimum-prod

      - name: Build Next.js Production App
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/school_erp_test?schema=public
          JWT_SECRET: test-jwt-secret-key-32chars-minimum-prod
          NEXT_TELEMETRY_DISABLED: 1

      - name: Validate Docker Image Build
        run: docker build -t india-unified-school-erp:ci-test .
